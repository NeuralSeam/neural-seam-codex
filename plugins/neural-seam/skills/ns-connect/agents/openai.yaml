interface:
  display_name: "Neural Seam Connect"
  short_description: "Bind an existing project to this folder"

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "neural-seam-runtime"
      description: "MCP server exposed by the neural-seam binary. Registered by this bundle."
    - type: "cli"
      value: "neural-seam"
      description: "The Neural Seam runtime binary, on PATH. Not bundled: install it separately."
